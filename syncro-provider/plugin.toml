id           = "awsumatt/syncro-provider"
name         = "Syncro Ticket Provider"
version      = "1.3.0"
plugin_api   = 6
author       = "awsumatt"
license      = "CC"
icon         = "ticket"
description  = "Search SyncroMSP tickets directly from the Noctalia launcher."

[[setting]]
key          = "subdomain"
type         = "string"
label_key    = "settings.subdomain.label"
description_key = "settings.subdomain.description"
default      = ""

[[setting]]
key          = "api_key"
type         = "string"
label_key    = "settings.api_key.label"
description_key = "settings.api_key.description"
default      = ""

[[setting]]
key          = "time_filter"
type         = "select"
label_key    = "settings.time_filter.label"
description_key = "settings.time_filter.description"
default      = "2_weeks"
options      = [
  { value = "2_weeks", label_key = "settings.time_filter.2_weeks" },
  { value = "1_month", label_key = "settings.time_filter.1_month" },
  { value = "3_months", label_key = "settings.time_filter.3_months" },
  { value = "all", label_key = "settings.time_filter.all" }
]

[[setting]]
key          = "sort_by"
type         = "select"
label_key    = "settings.sort_by.label"
description_key = "settings.sort_by.description"
default      = "updated_desc"
options      = [
  { value = "updated_desc", label_key = "settings.sort_by.updated_desc" },
  { value = "created_desc", label_key = "settings.sort_by.created_desc" },
  { value = "created_asc", label_key = "settings.sort_by.created_asc" },
  { value = "number_desc", label_key = "settings.sort_by.number_desc" },
  { value = "number_asc", label_key = "settings.sort_by.number_asc" }
]

[[launcher_provider]]
id           = "tickets"
entry        = "tickets.luau"
prefix       = "ticket"
glyph        = "ticket"
debounce_ms  = 300
