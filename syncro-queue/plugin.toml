id           = "awsumatt/syncro-queue"
name         = "Syncro Ticket Queue"
version      = "1.0.0"
plugin_api   = 6
author       = "awsumatt"
license      = "CC"
icon         = "user-check"
description  = "Bar widget and panel showing open tickets assigned to a technician."

[[setting]]
key          = "subdomain"
type         = "string"
label_key    = "settings.subdomain.label"
description_key = "settings.subdomain.description"
default      = ""

[[setting]]
key          = "api_key"
type         = "string"
label_key    = "settings.api_key.label"
description_key = "settings.api_key.description"
default      = ""

[[setting]]
key          = "user_id"
type         = "string"
label_key    = "settings.user_id.label"
description_key = "settings.user_id.description"
default      = ""

[[setting]]
key          = "poll_interval"
type         = "int"
label_key    = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default      = 300

[[widget]]
id    = "widget"
entry = "widget.luau"

[[service]]
id    = "service"
entry = "service.luau"

[[panel]]
id    = "panel"
entry = "panel.luau"
